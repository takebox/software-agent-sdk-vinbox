[project]
name = "handprint-vinbox-tools"
version = "1.53.1"
description = "HandPrint Vinbox Tools - eyes and hands inside Vinbox (browser_use over CDP, pwsh terminal, file tools)"

requires-python = ">=3.12"
dependencies = [
    "handprint-vinbox-sdk",
    "tree-sitter>=0.24",
    "tree-sitter-bash>=0.23",
    "binaryornot>=0.6.0",
    "cachetools",
    "libtmux>=0.53.0",
    "pydantic>=2.13.5",
    "browser-use>=0.8.0",
    "func-timeout>=4.3.5",
    "tom-swe>=1.0.3",
]

[project.urls]
Source = "https://github.com/takebox/software-agent-sdk-vinbox"
Homepage = "https://github.com/takebox/software-agent-sdk-vinbox"
Documentation = "https://handprint.juglow.my.id/sdk"
"Bug Tracker" = "https://github.com/takebox/software-agent-sdk-vinbox/issues"

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["handprint.tools*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed", "**/*.j2"]
"handprint.tools.preset.subagents" = ["*.md"]
