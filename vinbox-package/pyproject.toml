[project]
name = "software-agent-sdk-vinbox"
version = "1.53.0"
description = "Complete HandPrint agent runtime for Vinbox: eyes and hands (browser_use over CDP), SDK, workspace and the REST/WebSocket agent server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vinbox", email = "vinbox@juglow.my.id" }]
keywords = ["vinbox", "handprint", "agent", "browser-use", "cdp", "automation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "handprint-vinbox-sdk==1.53.0",
  "handprint-vinbox-tools==1.53.0",
  "handprint-vinbox-workspace==1.53.0",
  "handprint-vinbox-agent-server==1.53.0",
]

[project.urls]
Homepage = "https://github.com/takebox/software-agent-sdk-vinbox"
Source = "https://github.com/takebox/software-agent-sdk-vinbox"
"Bug Tracker" = "https://github.com/takebox/software-agent-sdk-vinbox/issues"

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# Meta package: it ships no importable code, only the dependency contract that
# installs the four Vinbox distributions together.
[tool.setuptools]
packages = []
