---
name: Publish Vinbox packages

# Menerbitkan lima distribusi Vinbox. TestPyPI dulu, PyPI hanya setelah
# TestPyPI terbukti bisa dipasang.
#
# Rahasia yang dibutuhkan (Settings -> Secrets and variables -> Actions):
#   TESTPYPI_TOKEN  token TestPyPI
#   PYPI_TOKEN      token PyPI
# Keduanya milik pemilik repo; jangan ditulis di workflow.

on:
    workflow_dispatch:
        inputs:
            version:
                description: Versi yang diterbitkan, tanpa awalan v
                required: true
                type: string
            target:
                description: Tujuan unggah
                required: true
                type: choice
                default: testpypi
                options:
                    - testpypi
                    - pypi

concurrency:
    group: publish-vinbox-${{ inputs.target }}-${{ inputs.version }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        env:
            VERSION: ${{ inputs.version }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Validate version in all five pyproject files
              run: |
                  set -euo pipefail
                  files=(
                    vinbox-sdk/pyproject.toml
                    vinbox-tools/pyproject.toml
                    vinbox-workspace/pyproject.toml
                    vinbox-agent-server/pyproject.toml
                    vinbox-package/pyproject.toml
                  )
                  for file in "${files[@]}"; do
                    actual=$(grep -m1 '^version = ' "$file" | cut -d'"' -f2)
                    if [ "$actual" != "$VERSION" ]; then
                      echo "Versi $file = $actual, seharusnya $VERSION"
                      exit 1
                    fi
                  done
                  echo "Kelima pyproject memakai versi $VERSION"

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'

            - name: Build the five wheels
              run: |
                  bash scripts/build_vinbox_packages.sh

            - name: Check nothing wrong ships
              run: |
                  python scripts/check_vinbox_wheels.py dist-vinbox

            - name: Upload four packages, then the meta package
              env:
                  TESTPYPI_TOKEN: ${{ secrets.TESTPYPI_TOKEN }}
                  PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
              run: |
                  set -euo pipefail
                  python -m pip install --upgrade twine

                  if [ "${{ inputs.target }}" = "testpypi" ]; then
                    repo_args=(--repository-url https://test.pypi.org/legacy/)
                    token="${TESTPYPI_TOKEN:-}"
                    label="TestPyPI"
                  else
                    repo_args=()
                    token="${PYPI_TOKEN:-}"
                    label="PyPI"
                  fi

                  if [ -z "$token" ]; then
                    echo "Token untuk $label tidak tersedia"
                    exit 1
                  fi

                  four=(
                    dist-vinbox/handprint_vinbox_sdk-${VERSION}-py3-none-any.whl
                    dist-vinbox/handprint_vinbox_tools-${VERSION}-py3-none-any.whl
                    dist-vinbox/handprint_vinbox_workspace-${VERSION}-py3-none-any.whl
                    dist-vinbox/handprint_vinbox_agent_server-${VERSION}-py3-none-any.whl
                  )
                  meta="dist-vinbox/software_agent_sdk_vinbox-${VERSION}-py3-none-any.whl"

                  echo "Mengunggah empat paket ke $label"
                  python -m twine upload --skip-existing \
                    "${repo_args[@]}" -u __token__ -p "$token" "${four[@]}"

                  echo "Mengunggah meta paket ke $label"
                  python -m twine upload --skip-existing \
                    "${repo_args[@]}" -u __token__ -p "$token" "$meta"

                  echo "Selesai: $label memuat versi $VERSION"
