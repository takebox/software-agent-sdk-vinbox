[project]
name = "handprint-vinbox-sdk"
version = "1.53.0"
description = "HandPrint Vinbox SDK - agent core tailored to the Vinbox machine (CDP browser, pwsh, Vinbox model lane)"

requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol>=0.12.1,<0.13.0",  # 0.11.0 reordered prompt() args, broke the client (#4830)
    "deprecation>=2.1.0",
    "fakeredis[lua]>=2.32.1",  # Explicit dependency for docket/fastmcp background tasks
    # 3.2.0 reads back the stored absolute OAuth token expiry; 4.x requires
    # mcp>=2, which browser-use 0.11.x cannot use (#5152)
    "fastmcp>=3.2.0,<4",
    "filelock>=4.2.10",
    "httpx[socks]>=0.28.1",
    "jsonschema>=4.23.0",
    "joserfc>=1.7.5",
    "litellm>=1.93.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-frontmatter>=1.3.0",
    "python-json-logger>=3.3.0",
    "tenacity>=9.1.2",
    "websockets>=12",
    "lmnr>=0.7.60,<0.8.0",
    "tree-sitter>=0.25",
    "tree-sitter-bash>=0.25",
]

[project.urls]
Source = "https://github.com/takebox/software-agent-sdk-vinbox"
Homepage = "https://github.com/takebox/software-agent-sdk-vinbox"
Documentation = "https://handprint.juglow.my.id/sdk"
"Bug Tracker" = "https://github.com/takebox/software-agent-sdk-vinbox/issues"

[project.optional-dependencies]
boto3 = ["boto3>=1.35.0"]
toolshield = ["toolshield>=0.1.3,<0.2"]
vertex = ["google-cloud-aiplatform>=2.1.3"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["handprint.sdk*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed", "*.j2", "schemas/*.json"]
